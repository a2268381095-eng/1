<title>小恶魔衣橱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

:root {

  --f-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-pixel: "DotGothic16", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151017; --surface: #1e1720; --ink: #f1e5ec; --muted: #a58f9c; --line: #352a38;
    --accent: #ec82b1; --accent-ink: #2a0f1e; --accent-soft: #3b2231; --grid: #241b27;
    --done: #7fd1a8; --done-soft: #1f3a2d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151017; --surface: #1e1720; --ink: #f1e5ec; --muted: #a58f9c; --line: #352a38;
  --accent: #ec82b1; --accent-ink: #2a0f1e; --accent-soft: #3b2231; --grid: #241b27;
  --done: #7fd1a8; --done-soft: #1f3a2d;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); }
canvas { image-rendering: crisp-edges; image-rendering: pixelated; display: block; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 140px; display: grid; gap: 22px; }
.head { display: grid; gap: 8px; }
.head h1 { margin: 0; font-size: 22px; letter-spacing: 0.02em; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.75; max-width: 64ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12.5px; color: var(--muted); align-items: center; }
.badge { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.badge.custom { background: var(--done-soft); color: var(--done); }
.badge.basic { background: var(--grid); color: var(--muted); }
.label { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted); }

.overview { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .overview { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mini { display: grid; gap: 6px; padding: 8px 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  cursor: pointer; text-align: left; min-width: 0; }
.mini[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mini canvas { width: 100%; height: auto; max-width: 128px; justify-self: center; }
.mini .nm { font-size: 13px; font-weight: 500; line-height: 1.4; }
.mini .pick-dot { font-size: 11.5px; color: var(--accent); min-height: 1.2em; }

.detail { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 20px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
@media (max-width: 760px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.stage { display: grid; justify-items: center; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 6px;
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px; }
#big { max-width: 100%; height: auto; }
.meta { width: 100%; display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-pixel); font-size: 12px;
  color: var(--muted); font-variant-numeric: tabular-nums; }
.side { display: grid; gap: 16px; min-width: 0; }
.title-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.title-row h2 { margin: 0; font-size: 19px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); }
.pick { padding: 7px 14px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 480px) { .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 500; }
.strip { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }

.strip canvas.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.note { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); max-width: 60ch; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.copied { font-size: 12.5px; color: var(--muted); }
#fallback { width: 100%; font: inherit; font-size: 12px; }

<div class="wrap">
  <header class="head">
    <h1>小恶魔衣橱</h1>
    <p>6 套候选风格，每套 7 个动作，都是从你用 GPT 出的设定图转成的 128×224 像素小人。点一套放大看，再点动作逐个播放；挑出 5 套作为默认风格，底部一键复制给我。</p>
    <div class="legend">
      <span class="badge custom">精修</span><span>已经加了挥手、漩涡转动、尾巴甩动这类专门的动画</span>
      <span class="badge basic">基础浮动</span><span>暂时只有整体浮动和眨眼，接下来逐个精修</span>
    </div>
  </header>

  <section aria-labelledby="ov-h">
    <h2 class="label" id="ov-h">6 套总览</h2>
    <div class="overview" id="overview"></div>
  </section>

  <section class="detail" aria-label="当前这套">
    <div class="stage">
      <canvas id="big" aria-label="放大的小恶魔"></canvas>
      <div class="meta"><span id="m-act">idle</span><span id="m-frame">01/12</span></div>
    </div>
    <div class="side">
      <div class="title-row">
        <h2 id="d-name">原稿</h2>
        <button type="button" class="pick" id="d-pick" aria-pressed="false">选入默认 5 套</button>
      </div>
      <div class="chips" id="d-genres"></div>
      <div class="acts" id="acts" role="group" aria-label="动作"></div>
      <div class="row">
        <div class="seg" role="group" aria-label="播放速度">
          <button type="button" id="sp-05" data-speed="0.5" aria-pressed="false">0.5×</button>
          <button type="button" id="sp-1" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" id="sp-2" data-speed="2" aria-pressed="false">2×</button>
        </div>
        <div class="seg" role="group" aria-label="放大倍数">
          <button type="button" id="sc-1" data-scale="1" aria-pressed="false">1×</button>
          <button type="button" id="sc-2" data-scale="2" aria-pressed="true">2×</button>
          <button type="button" id="sc-3" data-scale="3" aria-pressed="false">3×</button>
        </div>
        <button type="button" class="pick" id="pause">暂停</button>
      </div>
      <div class="side">
        <h3 class="label">这个动作的每一帧</h3>
        <div class="strip" id="strip"></div>
      </div>
      <p class="note" id="d-note"></p>
    </div>
  </section>
</div>

<div class="bar" role="region" aria-label="已选风格">
  <div class="bar-in">
    <span class="count" id="count">0 / 5</span>
    <span class="picked" id="picked">还没选</span>
    <button type="button" class="copy" id="copy">复制我的选择</button>
    <span class="copied" id="copied" role="status"></span>
    <textarea id="fallback" rows="3" readonly hidden aria-label="选择结果，可手动复制"></textarea>
  </div>
</div>

  let cur = DATA.styles[0];
  DATA.styles.forEach((s) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "mini"; b.id = "mini-" + s.id; b.setAttribute("aria-pressed", "false");
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H; cv.setAttribute("aria-hidden", "true");
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = s.name;
    const dot = document.createElement("span"); dot.className = "pick-dot";
    b.append(cv, nm, dot);
    b.addEventListener("click", () => select(s));
    $("overview").append(b);
    const p = player(cv, 1);
    setAct(p, s.actions.find(a => a.key === "idle") || s.actions[0]);
    minis.push({ s, b, p, dot });
  });

  // ---------- 详情 ----------
  const big = player($("big"), 2);
  let speed = 1, paused = reduce;
  function select(s) {
    cur = s;
    minis.forEach(m => m.b.setAttribute("aria-pressed", String(m.s === s)));
    $("d-name").textContent = s.name;
    $("d-genres").textContent = "";
    s.genres.forEach(g => { const c = document.createElement("span"); c.className = "chip"; c.textContent = g; $("d-genres").append(c); });
    syncPick();
    const box = $("acts"); box.textContent = "";
    s.actions.forEach((a, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "act"; b.id = "act-" + a.key; b.setAttribute("aria-pressed", String(i === 0));
      const n = document.createElement("span"); n.className = "an"; n.textContent = a.name;
      const k = document.createElement("span"); k.className = "badge " + (a.kind === "custom" ? "custom" : "basic");
      k.textContent = a.kind === "custom" ? "精修 · " + a.frames + " 帧" : "基础浮动";
      b.append(n, k);
      b.addEventListener("click", () => playAct(a));
      box.append(b);
    });
    const custom = s.actions.filter(a => a.kind === "custom").map(a => a.name);
    $("d-note").textContent = custom.length
      ? "已精修：" + custom.join("、") + "。其余动作暂时是基础浮动，接下来逐个加专门的动画。"
      : "这套的 7 个动作目前都是基础浮动，接下来逐个加专门的动画。";
    playAct(s.actions[0]);
  }
  function playAct(a) {
    document.querySelectorAll(".act").forEach(b => b.setAttribute("aria-pressed", String(b.id === "act-" + a.key)));
    setAct(big, a);
    buildStrip(a);
    meta();
  }
  function buildStrip(a) {
    const box = $("strip"); box.textContent = "";
    const im = img(a.src);
    const fill = () => {
      box.textContent = "";
      for (let i = 0; i < a.frames; i++) {
        const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
        if (im.naturalWidth) ctx.drawImage(im, i * W, 0, W, H, 0, 0, W, H);
        box.append(cv);
      }
      markStrip();
    };
    if (im.complete && im.naturalWidth) fill(); else im.addEventListener("load", fill, { once: true });
  }
  function markStrip() { [...$("strip").children].forEach((c, i) => c.classList.toggle("on", i === big.f)); }
  function meta() {
    if (!big.act) return;
    $("m-act").textContent = big.act.key + " · " + big.act.ms[big.f] + "ms";
    $("m-frame").textContent = String(big.f + 1).padStart(2, "0") + "/" + String(big.act.frames).padStart(2, "0");
  }
  function drawAll() { minis.forEach(m => draw(m.p)); draw(big); }

  document.querySelectorAll("[data-speed]").forEach(b => b.addEventListener("click", () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll("[data-speed]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
  document.querySelectorAll("[data-scale]").forEach(b => b.addEventListener("click", () => {
    big.scale = Number(b.dataset.scale);
    document.querySelectorAll("[data-scale]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    draw(big);
  }));
  const setPaused = (v) => { paused = v; $("pause").textContent = v ? "播放" : "暂停"; };
  $("pause").addEventListener("click", () => setPaused(!paused));
  setPaused(paused);

  // ---------- 选入默认 5 套 ----------
  function syncPick() {
    const on = picked.has(cur.id);
    $("d-pick").setAttribute("aria-pressed", String(on));
    $("d-pick").textContent = on ? "已选入" : "选入默认 5 套";
    minis.forEach(m => { m.dot.textContent = picked.has(m.s.id) ? "已选入" : ""; });
    $("count").textContent = picked.size + " / 5";
    $("picked").textContent = picked.size ? DATA.styles.filter(s => picked.has(s.id)).map(s => s.name).join("、") : "还没选";
  }
  $("d-pick").addEventListener("click", () => {
    if (picked.has(cur.id)) picked.delete(cur.id); else picked.add(cur.id);
    syncPick();
  });
  $("copy").addEventListener("click", () => {
    const lines = ["小恶魔衣橱 · 我选的默认 5 套："];
    DATA.styles.filter(s => picked.has(s.id)).forEach((s, i) => lines.push((i + 1) + ". " + s.name + "（" + s.id + "）"));
    if (!picked.size) lines.push("（还没选）");
    const text = lines.join("\n");
    const msg = $("copied"), fb = $("fallback");
    const fallback = () => { fb.hidden = false; fb.value = text; fb.focus(); fb.select(); msg.textContent = "复制没成功，已选中下面的文字，手动复制即可"; };
    try { navigator.clipboard.writeText(text).then(() => { msg.textContent = "已复制，粘贴给 Claude 就行"; fb.hidden = true; }, fallback); }
    catch (e) { fallback(); }
  });

  // ---------- 主循环 ----------
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(t - last, 250); last = t;
    if (!paused) {
      minis.forEach(m => { if (tick(m.p, dt * speed)) draw(m.p); });
      if (tick(big, dt * speed)) { draw(big); markStrip(); meta(); }
    }
    requestAnimationFrame(loop);
  }
  select(cur);
  requestAnimationFrame(loop);
})();
</script>
