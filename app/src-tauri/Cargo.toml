[package]
name = "xiaoemo-wenshu"
version = "0.1.0"
description = "小恶魔文书：本地中文写作软件"
edition = "2021"

[lib]
name = "xiaoemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "~2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
